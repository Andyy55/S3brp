name: Build_ESP32S3_Dynamic

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      sketch_path:
        description: 'Nama folder atau file .ino (kosongkan untuk deteksi otomatis)'
        required: false
        default: ''

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install Libraries
        run: |
          # Install library resmi dari Library Manager
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          
          # Install library custom dari GitHub (Rogue Edition)
          mkdir -p $HOME/Arduino/libraries
          git clone https://github.com/me-no-dev/ESPAsyncWebServer.git $HOME/Arduino/libraries/ESPAsyncWebServer
          git clone https://github.com/me-no-dev/AsyncTCP.git $HOME/Arduino/libraries/AsyncTCP
          
          # --- FIX MD5 ERROR UNTUK ESP32-S3 ---
          sed -i 's/#include "md5.h"/#include "rom\/md5_utils.h"/' $HOME/Arduino/libraries/ESPAsyncWebServer/src/WebAuthentication.cpp

      - name: Compile Sketch
        run: |
          mkdir -p build
          # Cari file .ino yang aktif (bukan .ino.1)
          ACTIVE_SKETCH=$(ls *.ino | head -n 1)
          SKETCH_NAME=$(basename "$ACTIVE_SKETCH" .ino)
          
          # Bikin folder dadakan biar Arduino CLI gak rewel
          mkdir -p "$SKETCH_NAME"
          cp "$ACTIVE_SKETCH" "$SKETCH_NAME/"
          
          echo "Building: $SKETCH_NAME"
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir ./build --libraries $HOME/Arduino/libraries "$SKETCH_NAME"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-OLED-Firmware
          path: build/*.bin
