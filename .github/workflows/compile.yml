name: Compile Sketch ESP32-S3p
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          export PATH=$PATH:$(pwd)/bin

      - name: Install ESP32 Board
        run: |
          bin/arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          bin/arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install Libraries
        run: |
          # Download library dari GitHub langsung (Clone)
          git clone https://github.com/me-no-dev/ESPAsyncWebServer.git /home/runner/Arduino/libraries/ESPAsyncWebServer
          git clone https://github.com/me-no-dev/AsyncTCP.git /home/runner/Arduino/libraries/AsyncTCP
          # Library yang ada di manager tinggal install biasa
          bin/arduino-cli lib install "Adafruit NeoPixel"
          bin/arduino-cli lib install "IRremoteESP8266"
          git clone https://github.com/martin-ger/esp32_nat_router.git /home/runner/Arduino/libraries/ESP32_NAT_Router
          
            - name: Compile Sketch
        run: |
          # Ditambahin build property biar fitur NAPT di core ESP32 aktif
          bin/arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --build-property "build.extra_flags=-DCONFIG_LWIP_IP_FORWARD=1 -DCONFIG_LWIP_IPV4_NAPT=1" \
            S3brp.ino --output-dir ./build

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: RogueS3-Firmware
          path: ./build/*.bin
